[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigora"
version = "1.0.0"
description = "Authoring package for Trigora durable programs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Trigora" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["tcc-engine==26.10.2", "trigora-cli==1.0.0"]

[project.urls]
Homepage = "https://trigora.dev"
Repository = "https://github.com/trigora-dev/trigora-python"

[tool.setuptools.packages.find]
where = ["src"]
