[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigora"
version = "0.9.0"
description = "Authoring package for Trigora durable programs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Trigora" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
# trigora-cli stays lockstep with this package. A public release should use the
# Trigora version, likely 1.0.0, unless the CLI package is versioned on its own.
dependencies = ["tcc-engine==0.1.0", "trigora-cli==0.9.0"]

[project.urls]
Homepage = "https://trigora.dev"
Repository = "https://github.com/trigora-dev/trigora-python"

[tool.setuptools.packages.find]
where = ["src"]
