[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigora-client"
version = "1.0.1"
description = "Python client for Trigora Cloud and the local runtime"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Trigora" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://trigora.dev"
Repository = "https://github.com/trigora-dev/trigora-python"

[tool.setuptools.packages.find]
where = ["src"]
