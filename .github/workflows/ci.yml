name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff setuptools wheel
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/checkout@v5
        with:
          repository: trigora-dev/trigora
          path: sibling-trigora
      - run: PYTHONPATH=src python3 tests/test_sdk.py
        working-directory: trigora
      - run: PYTHONPATH=src python3 tests/test_package.py
        working-directory: trigora
      - run: TRIGORA_CLI_SRC="$GITHUB_WORKSPACE/sibling-trigora/python/trigora-cli" PYTHONPATH=src python3 tests/test_install.py
        working-directory: trigora
      - run: PYTHONPATH=src python3 tests/test_client.py
        working-directory: trigora-client
