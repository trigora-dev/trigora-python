name: package

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist trigora
      - run: python -m build --wheel --outdir dist trigora-client
      - name: Assert wheel contents
        run: python trigora/tests/test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: trigora-python-1.0.0
          path: dist/*
