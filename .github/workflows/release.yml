name: release

on:
  push:
    tags: ["v1.0.1"]

jobs:
  package:
    uses: ./.github/workflows/package.yml

  publish-client:
    needs: package
    runs-on: ubuntu-latest
    environment: release-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: trigora-python-1.0.1
          path: dist
      - name: Stage the client wheel
        run: |
          mkdir -p client-dist
          cp dist/trigora_client-*.whl client-dist/
      - name: Publish trigora-client
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: client-dist/
          attestations: false
          skip-existing: true

  publish:
    needs: publish-client
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: trigora-python-1.0.1
          path: dist
      - name: Stage the trigora wheel
        run: |
          mkdir -p trigora-dist
          cp dist/trigora-*.whl trigora-dist/
      - name: Publish trigora
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: trigora-dist/
          attestations: false
          skip-existing: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
